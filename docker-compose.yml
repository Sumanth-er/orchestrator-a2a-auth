services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.5.5
    container_name: a2a-keycloak
    command:
      - start-dev
      - --features=token-exchange-standard
      - --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-data:/opt/keycloak/data

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A2A Demo</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://unpkg.com/oidc-client-ts@3.1.0/dist/browser/oidc-client-ts.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">A2A Demo</div>
    <div id="who" class="who">—</div>
    <button id="logout" class="btn-ghost" hidden>Sign out</button>
  </header>

  <main id="gate" class="gate">
    <h1>Sign in to continue</h1>
    <p>You will be redirected to Keycloak.</p>
    <button id="login" class="btn-primary">Sign in</button>
  </main>

  <main id="chat" class="chat" hidden>
    <div id="log" class="log" aria-live="polite"></div>
    <form id="composer">
      <input id="msg" type="text" autocomplete="off"
             placeholder="Ask about weather, billing, or anything…" />
      <button class="btn-primary">Send</button>
    </form>
  </main>

  <script src="/app.js"></script>
</body>
</html>

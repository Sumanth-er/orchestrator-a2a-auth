[project]
name = "demo-a2a"
version = "0.1.0"
description = "A2A + Keycloak auth demo: orchestrator authn, agent-side authz, token-exchange hops"
requires-python = ">=3.11"
dependencies = [
    # Older a2a-sdk releases use FieldDescriptor.label which is gone in
    # protobuf 5.x+. shared/proto_compat.py monkey-patches it back so we
    # don't need to pin a particular SDK version.
    "a2a-sdk[http-server]>=0.3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "langchain-ollama>=0.2",
    "langchain-core>=0.3",
    # New orchestrator runtime: create_agent + AgentMiddleware live here
    "langchain>=1.0",
    "langgraph>=0.2",
    "pyjwt[crypto]>=2.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sse-starlette>=2.1",
    "python-dotenv>=1.0",
]

[tool.uv.workspace]
members = ["orchestrator", "agents/*", "shared"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "orchestrator*", "agents*"]
